<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vite Vendu</title>
<meta name="theme-color" content="#22345c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vite Vendu">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de poche, direct et chaleureux
   IDEA: l'étiquette carton accrochée au vêtement, cousue sur du denim
   PICTURE: grande étiquette kraft avec le total gagné ; chaque article en étiquette ; gros bouton micro rond
   COLOUR and TYPE: denim profond, kraft, fil orange ; Archivo + Inter
   LAYOUT: une colonne mobile, bandeau denim, barre d'action collée en bas */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1426);--ink:light-dark(#141b2d,#edf0f7);--mut:light-dark(#5a6377,#9ba5bb);
--card:light-dark(#ffffff,#151f37);--line:light-dark(#e2e5ec,#27324f);--soft:light-dark(#f4f5f8,#111a30);
--denim:#22345c;--denim2:light-dark(#2f4778,#a9c3ff);--kraft:light-dark(#e6cfa6,#4a3d28);--kraftink:light-dark(#3b2a10,#f4e4c6);
--stitch:#ff6a3d;--ok:light-dark(#11795a,#5fd3a6);--warn:light-dark(#a24b00,#ffb36b)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:32px;font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:18px;font-weight:800}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--stitch);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.top{background:var(--denim);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) max(5vw,16px) 24px;border-bottom:3px dashed var(--stitch);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;flex:none}
.icon svg{width:22px;height:22px}
.hang{position:relative;margin:22px 0 0 18px;background:var(--kraft);color:var(--kraftink);border-radius:8px 18px 18px 8px;padding:20px 20px 18px 44px;box-shadow:0 10px 0 -4px rgba(0,0,0,.18);clip-path:polygon(22px 0,100% 0,100% 100%,22px 100%,0 50%)}
.hang::before{content:"";position:absolute;left:18px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--denim);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.str{position:absolute;left:-2px;top:-6px;width:40px;height:60px;pointer-events:none}
.big{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(40px,12vw,52px);line-height:1}
.lbl{font-size:14px;opacity:.8;margin-top:4px}
.mini{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px}
.mini b{font-family:Archivo,sans-serif;font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px max(5vw,16px) 4px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.5}
.list{display:grid;gap:12px;padding:12px max(5vw,16px) 120px}
.item{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--soft);display:block}
.ph{display:grid;place-items:center;color:var(--mut)}
.it{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.drop{display:block;font-size:13px;color:var(--warn);font-weight:600;margin-top:2px}
.pr{font-family:Archivo,sans-serif;font-weight:800;font-size:19px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:6px}
.s-draft{background:light-dark(#eceef3,#26304a);color:var(--mut)}.s-ready{background:light-dark(#fde6dc,#4a2619);color:light-dark(#a63a14,#ffb59a)}
.s-sell{background:light-dark(#dfe8fb,#1f3160);color:light-dark(#1d3f8f,#a9c3ff)}.s-sold{background:light-dark(#daf3e8,#173d31);color:var(--ok)}
.empty{text-align:center;padding:36px 12px;color:var(--mut)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);min-height:56px;padding:0 26px;border:0;border-radius:999px;background:var(--stitch);color:#fff;font-weight:700;font-size:17px;box-shadow:0 8px 24px rgba(255,106,61,.35);white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:18px}
.steps button{min-height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:14px;font-weight:600}
.steps button.on{background:#fff;color:var(--denim)}
.sec{padding:20px max(5vw,16px) 130px;display:grid;gap:20px}
.box{display:grid;gap:10px}
.lab{font-size:14px;font-weight:600}
.hint{font-size:14px;color:var(--mut);margin:0}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g3 label,.g2 label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.guess{color:var(--stitch);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pbox{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--soft);border:0;padding:0}
.pbox img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:6px;top:6px;background:var(--stitch);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.badge.ai{background:#6a4bd8}.badge.ed{left:auto;right:6px;background:var(--ok)}
.add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.add label{position:relative;display:grid;place-items:center;gap:6px;min-height:92px;border:2px dashed var(--line);border-radius:14px;font-weight:600;font-size:15px;text-align:center;padding:10px}
.add input,.hidden-in{position:absolute;opacity:0;width:1px;height:1px}
.add svg{width:26px;height:26px;color:var(--stitch)}
.btn{min-height:50px;border-radius:14px;border:0;padding:0 18px;font-weight:700;font-size:16px;background:var(--denim);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.alt{background:var(--soft);color:var(--ink);border:1.5px solid var(--line)}
.btn.hot{background:var(--stitch)}
.btn:disabled{opacity:.55}
.banner{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:12px;font-size:14px}
.mic-wrap{display:grid;justify-items:center;gap:10px;padding:18px;border-radius:18px;background:var(--soft)}
.micbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--stitch);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,106,61,.35)}
.micbtn svg{width:40px;height:40px}
.micbtn.rec{background:#d62f2f;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(214,47,47,.18)}}
.timer{font-family:Archivo,sans-serif;font-weight:800;font-size:22px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px max(5vw,16px) calc(env(safe-area-inset-bottom) + 10px);z-index:5}
.foot .wrap{display:flex;gap:10px}.foot .btn{flex:1}
.tag{position:relative;background:var(--kraft);color:var(--kraftink);border-radius:16px;padding:18px 18px 16px}
.tag .big{font-size:48px}
.tag .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag .row button{min-height:44px;border-radius:10px;border:1.5px solid rgba(0,0,0,.15);background:rgba(255,255,255,.35);color:inherit;padding:0 12px;font-size:14px}
.tag .row button.on{background:var(--denim);color:#fff;border-color:var(--denim)}
.tag p{margin:10px 0 0;font-size:14px}
.fld{display:grid;gap:6px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fh span{font-size:13px;font-weight:600;color:var(--mut)}
.cp{min-height:36px;min-width:84px;border-radius:999px;border:0;background:var(--denim);color:#fff;font-size:13px;font-weight:600;padding:0 12px}
.cp.done{background:var(--ok)}
.fld input,.fld textarea{border:0;padding:0;min-height:0;background:transparent;border-radius:0}
.fld textarea{min-height:150px}
.ext{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--denim2);text-decoration:none}
.err{background:light-dark(#fdecea,#3d1714);color:light-dark(#9b1c12,#ffb0a8);border-radius:12px;padding:12px;font-size:14px}
.note{font-size:13px;color:var(--mut);margin:0}
.card{display:grid;gap:12px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card)}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:r .8s linear infinite;vertical-align:-3px;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.micbtn.rec{animation:none}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px max(5vw,16px) calc(env(safe-area-inset-bottom) + 16px);display:grid;gap:10px;max-height:92vh;overflow:auto}
.sheet img{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:var(--soft)}
.sold{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--soft)}
ol.steps-list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
@media (max-width:380px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app" class="wrap"><header class="top"><h1>Vite Vendu</h1></header><p class="empty">Chargement…</p></div>
<div id="sheet"></div>
<div id="toast" class="toast" role="status"></div>
<script>
{
/* =============== outils =============== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=Math.round(parseFloat(String(v??'').replace(',','.')));return isNaN(x)?null:x};
const eur=n=>n==null||n===''||isNaN(n)?'—':Math.round(+n)+' €';
const days=t=>t?Math.floor((Date.now()-t)/864e5):0;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const STAT={draft:['À compléter','s-draft'],ready:['Prêt à publier','s-ready'],selling:['En vente','s-sell'],sold:['Vendu','s-sold']};
const ETATS=['Neuf avec étiquette','Neuf sans étiquette','Très bon état','Bon état','Satisfaisant'];
const TONES={simple:'Simple',chaleureux:'Chaleureux',pro:'Pro'};
const STYLES={court:'plus courte (2 à 3 phrases)',fun:'avec un ton plus fun et décontracté',vendeur:'plus vendeuse, en mettant en avant les points forts, sans exagérer ni mentir'};
const DECORS={rue:['Rue','dans une rue calme en ville, arrière-plan légèrement flou'],cosy:['Intérieur cosy','dans un intérieur lumineux et cosy (chambre ou salon), arrière-plan légèrement flou'],studio:['Mur uni','devant un mur uni blanc cassé ou beige, sans décor'],parc:['Parc','en extérieur dans un parc, lumière douce de fin de journée']};
const FIELDS={brand:'Marque',size:'Taille',color:'Couleur',material:'Matière'};
const AI_NOTE='Info : la dernière photo est un visuel généré par IA pour illustrer le porté. Les autres photos montrent l’article réel.';
const IC={gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>',
shirt:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0z"/></svg>',
mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'};
const STR='<svg class="str" viewBox="0 0 40 60"><path d="M27 34 C 14 26, 10 12, 2 2" stroke="#ff6a3d" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';

/* =============== stockage (IndexedDB) =============== */
const DB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('vitevendu',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(st,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return{all:()=>tx('items','readonly',s=>s.getAll()),put:it=>tx('items','readwrite',s=>s.put(it)),del:id=>tx('items','readwrite',s=>s.delete(id)),
    putPhoto:(k,b)=>tx('photos','readwrite',s=>s.put(b,k)),getPhoto:k=>tx('photos','readonly',s=>s.get(k)),delPhoto:k=>tx('photos','readwrite',s=>s.delete(k))};
})();
const urls={};
async function photoUrl(id){if(urls[id])return urls[id];const b=await DB.getPhoto(id).catch(()=>null);if(!b)return '';return urls[id]=URL.createObjectURL(b)}
async function photoBlob(id){return DB.getPhoto(id)}
function hydrate(){document.querySelectorAll('img[data-pid]').forEach(async im=>{const u=await photoUrl(im.dataset.pid);if(u&&im.src!==u)im.src=u})}

/* =============== état =============== */
const S={items:[],settings:Object.assign({tone:'chaleureux',sign:'Envoi rapide et soigné.',tags:'',key:'',model:''},ls.get('vv-set',{})),
  view:'home',filter:'all',cur:null,step:0,busy:'',err:'',confirmDel:false,soldOpen:false,rec:null,recT:0,prefill:'',decor:'cosy',sheet:null};
const app=$('#app');
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms||2400)}
function saveSettings(){ls.set('vv-set',S.settings)}
let saveT=null;
function hasContent(c){return c&&(c.photos.length||c.notes||c.brand||c.ai)}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(saveNow,600)}
function saveNow(){clearTimeout(saveT);const c=S.cur;if(!hasContent(c))return;c.updated=Date.now();const body=JSON.parse(JSON.stringify(c));
  const i=S.items.findIndex(x=>x.id===body.id);if(i<0)S.items.unshift(body);else S.items[i]=body;
  DB.put(body).catch(()=>toast('Sauvegarde impossible : stockage du téléphone plein ?'))}

/* =============== images =============== */
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{res([im,u])};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('image illisible'))};im.src=u})}
async function shrink(blob,max,q){const [im,u]=await loadImg(blob);const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return toBlob(c,q)}
const toBlob=(c,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('image')),'image/jpeg',q||.88));
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob)});
async function enhance(blob){
  const [im,u]=await loadImg(blob);const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);URL.revokeObjectURL(u);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data,n=p.length/4;
  const hist=new Uint32Array(256);let sr=0,sg=0,sb=0;
  for(let i=0;i<p.length;i+=4){const l=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;hist[l]++;sr+=p[i];sg+=p[i+1];sb+=p[i+2]}
  let lo=0,hi=255,acc=0;for(;lo<255;lo++){acc+=hist[lo];if(acc>n*.005)break}acc=0;for(;hi>0;hi--){acc+=hist[hi];if(acc>n*.005)break}
  if(hi-lo<40){lo=0;hi=255}
  const mr=sr/n,mg=sg/n,mb=sb/n,mm=(mr+mg+mb)/3,wr=1+(mm/mr-1)*.5,wg=1+(mm/mg-1)*.5,wb=1+(mm/mb-1)*.5,sc=255/(hi-lo);
  const lut=new Uint8ClampedArray(256);for(let v=0;v<256;v++){const t=Math.min(1,Math.max(0,(v-lo)/(hi-lo)));lut[v]=Math.round(255*Math.pow(t,.94))}

/* =============== audio =============== */
async function toWav(blob){
  const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();
  const buf=await new Promise((res,rej)=>{blob.arrayBuffer().then(ab=>{const p=ac.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)},rej)});
  try{ac.close()}catch(e){}
  const rate=16000,off=new OfflineAudioContext(1,Math.max(1,Math.ceil(buf.duration*rate)),rate),src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();
  const out=(await off.startRendering()).getChannelData(0),len=out.length,ab=new ArrayBuffer(44+len*2),v=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){const s=Math.max(-1,Math.min(1,out[i]));v.setInt16(44+i*2,s<0?s*32768:s*32767,true)}
  return new Blob([ab],{type:'audio/wav'});
}
async function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Enregistrement audio non pris en charge ici');return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Micro refusé. Autorise-le dans Réglages › Safari › Micro.',4000);return}
  const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(S.recI);const blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/mp4'});S.rec=null;render();if(blob.size>1000)voiceNote(blob);else toast('Enregistrement trop court')};
  mr.start(500);S.rec=mr;S.recT=Date.now();S.recI=setInterval(()=>{const t=$('#timer');const s=Math.floor((Date.now()-S.recT)/1000);if(t)t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=180)mr.stop()},250);render();
}

const GB='https://generativelanguage.googleapis.com/v1beta/';
async function models(force){
  const k=S.settings.key;if(!k)throw new Error('Ajoute ta clé Gemini dans les réglages.');
  const cached=ls.get('vv-models',null);if(!force&&cached&&cached.k===k.slice(-6)&&Date.now()-cached.t<3*864e5)return cached.list;
  const r=await fetch(GB+'models?pageSize=200&key='+encodeURIComponent(k));
  if(!r.ok){if(r.status===400||r.status===403)throw new Error('Clé Gemini refusée : vérifie-la dans les réglages.');throw new Error('Gemini injoignable ('+r.status+')')}
  const j=await r.json(),vers=n=>{const m=n.match(/(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  const list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(m.name)&&!/image|tts|live|audio|embed|thinking|robot|computer|nano|exp/.test(m.name)).map(m=>m.name)
    .sort((a,b)=>{const la=/lite/.test(a),lb=/lite/.test(b);if(la!==lb)return la?1:-1;const pa=/preview/.test(a),pb=/preview/.test(b);if(pa!==pb)return pa?1:-1;const va=vers(b)-vers(a);if(va)return va;return a.length-b.length});
  ls.set('vv-models',{k:k.slice(-6),t:Date.now(),list});return list;
}
async function gemini(parts,json){
  let list=await models();if(S.settings.model)list=[S.settings.model,...list.filter(m=>m!==S.settings.model)];
  if(!list.length)throw new Error('Aucun modèle Gemini disponible avec cette clé.');
  let last='';
  for(const m of list.slice(0,4)){
    let r;try{r=await fetch(GB+m+':generateContent?key='+encodeURIComponent(S.settings.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:json?{responseMimeType:'application/json',temperature:.4}:{temperature:.5}})})}catch(e){last='connexion impossible';continue}
    if(r.status===429||r.status===404||r.status>=500){last=r.status===429?'quota gratuit atteint pour le moment':'modèle indisponible';continue}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){if(r.status===400&&/API key/i.test(JSON.stringify(j)))throw new Error('Clé Gemini invalide : vérifie-la dans les réglages.');last=(j.error&&j.error.message)||('erreur '+r.status);continue}
    const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
    if(!t){last='réponse vide (contenu bloqué ?)';continue}

}

async function editPhoto(kind){
  const c=S.cur,i=S.sheet.i,p=c.photos[i];
  S.sheet.busy=kind==='enh'?'Amélioration…':'Détourage… (peut prendre 30 s)';renderSheet();
  try{
    const src=await photoBlob(p.id);
    const out=kind==='enh'?await enhance(src):await whiteBg(src,pc=>{if(S.sheet){S.sheet.busy='Téléchargement du module… '+pc+' %';renderSheet()}});
    const id=uid('p');await DB.putPhoto(id,out);
    if(p.orig){DB.delPhoto(p.id).catch(()=>{})}else p.orig=p.id;
    if(urls[p.id]&&p.id!==p.orig){URL.revokeObjectURL(urls[p.id]);delete urls[p.id]}
    p.id=id;saveNow();toast(kind==='enh'?'Photo améliorée':'Fond blanc appliqué');
  }catch(e){toast(kind==='wbg'?'Détourage impossible sur ce téléphone pour le moment':'Retouche impossible',3500)}
  if(S.sheet)S.sheet.busy='';render();
}

async function addFiles(files,ai){
  const c=S.cur;if(!c||!files.length)return;S.busy='photos';render();
  for(const f of files){try{const b=await shrink(f,1600,.88),id=uid('p');await DB.putPhoto(id,b);const p={id};if(ai)p.ai=true;if(ai)c.photos.push(p);else{const k=c.photos.findIndex(x=>x.ai);k<0?c.photos.push(p):c.photos.splice(k,0,p)}}catch(e){toast('Une photo n’a pas pu être ajoutée')}}
  S.busy='';saveNow();render();if(!ai)prefill();else toast('Visuel IA ajouté en dernière photo');
}
async function exportAll(){
  S.busy='export';render();
  try{
    const photos={};for(const it of S.items)for(const p of it.photos||[])for(const id of [p.id,p.orig].filter(Boolean)){const b=await DB.getPhoto(id).catch(()=>null);if(b)photos[id]=await b64(b)}
    const blob=new Blob([JSON.stringify({app:'vite-vendu',v:2,date:new Date().toISOString(),items:S.items,photos,settings:{...S.settings,key:''}})],{type:'application/json'});
    const f=new File([blob],'vite-vendu-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
    if(!(await shareFiles([f]))){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){toast('Export impossible')}
  S.busy='';render();
}
async function importAll(file){
  try{const j=JSON.parse(await file.text());if(j.app!=='vite-vendu')throw 0;
    for(const id in j.photos||{}){const bin=atob(j.photos[id]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await DB.putPhoto(id,new Blob([u],{type:'image/jpeg'}))}
    for(const it of j.items||[]){await DB.put(it)}S.items=(await DB.all()).sort((a,b)=>(b.updated||0)-(a.updated||0));toast((j.items||[]).length+' article(s) importé(s)');render();
  }catch(e){toast('Fichier de sauvegarde illisible')}
}
async function act(a,v,b){
  const c=S.cur;
  switch(a){
    case 'new':S.cur={id:uid('it_'),status:'draft',created:Date.now(),photos:[],notes:'',type:'',brand:'',size:'',color:'',material:'',etat:'',defects:'',measures:'',genre:'',paid:null,wanted:null,min:null,goal:'max',seen:'',ai:null,price:null,guess:{}};S.view='edit';S.step=0;S.err='';S.prefill='';break;
    case 'open':{const it=S.items.find(i=>i.id===v);if(!it)return;S.cur=JSON.parse(JSON.stringify(it));S.cur.photos=S.cur.photos||[];S.view='edit';S.step=it.ai?2:it.photos&&it.photos.length?1:0;S.err='';S.prefill=it.prefillSig?'':'';break}
    case 'home':if(S.rec)S.rec.stop();saveNow();S.cur=null;S.sheet=null;S.view='home';S.confirmDel=false;S.soldOpen=false;S.err='';break;
    case 'settings':S.view='settings';S.keyMsg='';break;
    case 'filter':S.filter=v;break;
    case 'step':S.step=+v;S.confirmDel=false;S.err='';break;
    case 'next':saveNow();S.step=Math.min(2,S.step+1);S.err='';break;
    case 'prefill':if(c){c.prefillSig='';prefill()}return;
    case 'photo':S.sheet={i:+v,busy:''};renderSheet();return;
    case 'sheetbg':if(b===document.querySelector('.sheet')&&!S.sheet.busy){S.sheet=null;renderSheet()}return;
    case 'sheetclose':S.sheet=null;render();return;
    case 'pmain':{const p=c.photos.splice(S.sheet.i,1)[0];c.photos.unshift(p);S.sheet=null;saveNow();break}
    case 'pdel':{const p=c.photos.splice(S.sheet.i,1)[0];if(p){DB.delPhoto(p.id).catch(()=>{});if(p.orig)DB.delPhoto(p.orig).catch(()=>{})}S.sheet=null;saveNow();break}
    case 'revert':{const p=c.photos[S.sheet.i];DB.delPhoto(p.id).catch(()=>{});p.id=p.orig;delete p.orig;saveNow();break}
    case 'enh':editPhoto('enh');return;
    case 'wbg':editPhoto('wbg');return;
    case 'decor':S.decor=v;break;
    case 'worn':{
      const t=wornPrompt();copy(t);const m=c.photos.find(p=>!p.ai);
      let shared=false;if(m){const bl=await photoBlob(m.id);if(bl)shared=await shareFiles([new File([bl],'article.jpg',{type:'image/jpeg'})],t)}
      if(!shared){toast('Consigne copiée. Ouvre Gemini, ajoute la photo et colle.',4000);window.open('https://gemini.google.com/app','_blank')}
      return}
    case 'savephotos':{
      const files=[];for(const [i,p] of c.photos.entries()){const bl=await photoBlob(p.id);if(bl)files.push(new File([bl],'vinted-'+(i+1)+'.jpg',{type:'image/jpeg'}))}
      if(!files.length){toast('Aucune photo');return}
      if(!(await shareFiles(files)))toast('Partage indisponible : ouvre l’appli depuis l’écran d’accueil',3500);return}
    case 'rec':if(needKey())return;startRec();return;
    case 'recstop':if(S.rec)S.rec.stop();return;
    case 'etat':c.etat=c.etat===v?'':v;if(c.guess)delete c.guess.etat;if(c.ai)c.ai.etat=c.etat||c.ai.etat;saveNow();break;
    case 'goal':c.goal=v;saveNow();break;
    case 'analyze':analyze('full');return;
    case 'reprice':analyze('price');return;
    case 'desc':analyze(v);return;
    case 'setprice':c.price=+v;saveNow();break;
    case 'copy':{const t=fieldText(v);if(!t){toast('Champ vide');return}copy(t,b);return}
    case 'published':c.status='selling';c.listedAt=Date.now();saveNow();toast('Bonne vente !');S.cur=null;S.view='home';break;
    case 'sold':S.soldOpen=!S.soldOpen;break;
    case 'soldok':c.soldPrice=num($('#soldp').value)??c.price;c.status='sold';c.soldAt=Date.now();S.soldOpen=false;saveNow();toast('Vendu '+eur(c.soldPrice)+' !');break;
    case 'relist':c.status='selling';c.soldPrice=null;c.soldAt=null;c.listedAt=Date.now();saveNow();break;
    case 'del':
      if(!S.confirmDel){S.confirmDel=true;break}
      S.items=S.items.filter(i=>i.id!==c.id);DB.del(c.id).catch(()=>{});for(const p of c.photos){DB.delPhoto(p.id).catch(()=>{});if(p.orig)DB.delPhoto(p.orig).catch(()=>{})}
      S.cur=null;S.view='home';S.confirmDel=false;toast('Article supprimé');break;
    case 'tone':S.settings.tone=v;saveSettings();break;
    case 'testkey':
      S.busy='test';S.keyMsg='';render();
      try{const l=await models(true);S.keyMsg=l.length?'✓ Clé valide. Modèle utilisé : '+l[0].replace('models/',''):'Clé valide mais aucun modèle compatible trouvé.'}catch(e){S.keyMsg='✗ '+errMsg(e)}
      S.busy='';break;
    case 'export':exportAll();return;
  }
  render();
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v,b)});
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v,e.target.closest('.sheet')===e.target?e.target:b)});
app.addEventListener('input',e=>{
  const t=e.target,c=S.cur;
  if(t.dataset.f&&c){const f=t.dataset.f;c[f]=['paid','wanted','min','price'].includes(f)?num(t.value):t.value;if(c.guess&&c.guess[f]){delete c.guess[f]}saveSoon()}
  else if(t.dataset.ai&&c&&c.ai){c.ai[t.dataset.ai]=t.value;saveSoon()}
  else if(t.dataset.s){S.settings[t.dataset.s]=t.dataset.s==='key'?t.value.trim():t.value;saveSettings()}
});
app.addEventListener('change',e=>{const t=e.target;if(t.type!=='file')return;const fs=[...t.files];t.value='';const k=t.dataset.in;if(k==='import'){if(fs[0])importAll(fs[0])}else addFiles(fs,k==='ai')});

/* =============== démarrage =============== */
(async()=>{
  try{S.items=(await DB.all()).sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0))}catch(e){toast('Stockage indisponible (navigation privée ?)',4000)}
  render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
}
</script>
